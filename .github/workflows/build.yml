name: Build Installers

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        shell: bash
        run: |
          npm ci
          (cd backend && npm ci)
          (cd frontend && npm ci)

      - name: Build frontend
        shell: bash
        run: npm run build:frontend

      - name: Build backend
        shell: bash
        run: npm run build:backend

      - name: Stage app bundle (node runtime + prod deps + template DB)
        shell: bash
        run: node scripts/package-app.mjs 2>&1 | tee stage.log

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build NSIS installer
        shell: bash
        run: |
          npx tauri --version 2>&1 | tee tauri.log
          npx tauri build --bundles nsis 2>&1 | tee -a tauri.log

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --notes "Offline installers — Windows (.exe), Linux (.deb, .AppImage)" \
            --verify-tag || true
          gh release upload "$GITHUB_REF_NAME" src-tauri/target/release/bundle/nsis/*.exe --clobber

      - name: Publish failure logs
        if: failure()
        shell: bash
        run: |
          mkdir -p ci-logs
          for f in stage.log tauri.log; do
            if [ -f "$f" ]; then
              cp "$f" "ci-logs/$GITHUB_JOB-$f"
              echo "::error title=$GITHUB_JOB failed::$(tail -n 12 "$f" | tr '\n' ' ')"
            fi
          done
          npx tauri info >> "ci-logs/$GITHUB_JOB-tauri-info.txt" 2>&1 || true
          git config user.name "ci-logs-bot"
          git config user.email "ci-logs-bot@users.noreply.github.com"
          git checkout -B "ci-logs-$GITHUB_JOB"
          git add -f ci-logs
          git commit -m "logs: $GITHUB_JOB (run $GITHUB_RUN_ID)" --allow-empty
          git push --force origin "HEAD:refs/heads/ci-logs-$GITHUB_JOB"

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install system deps (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install dependencies
        run: |
          npm ci
          (cd backend && npm ci)
          (cd frontend && npm ci)

      - name: Build frontend
        run: npm run build:frontend

      - name: Build backend
        run: npm run build:backend

      - name: Stage app bundle (node runtime + prod deps + template DB)
        shell: bash
        run: node scripts/package-app.mjs 2>&1 | tee stage.log

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build deb + AppImage
        shell: bash
        run: |
          npx tauri --version 2>&1 | tee tauri.log
          npx tauri build --bundles deb,appimage 2>&1 | tee -a tauri.log

      - uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --notes "Offline installers — Windows (.exe), Linux (.deb, .AppImage)" \
            --verify-tag || true
          gh release upload "$GITHUB_REF_NAME" \
            src-tauri/target/release/bundle/deb/*.deb \
            src-tauri/target/release/bundle/appimage/*.AppImage \
            --clobber

      - name: Publish failure logs
        if: failure()
        run: |
          mkdir -p ci-logs
          for f in stage.log tauri.log; do
            if [ -f "$f" ]; then
              cp "$f" "ci-logs/$GITHUB_JOB-$f"
              echo "::error title=$GITHUB_JOB failed::$(tail -n 12 "$f" | tr '\n' ' ')"
            fi
          done
          npx tauri info >> "ci-logs/$GITHUB_JOB-tauri-info.txt" 2>&1 || true
          git config user.name "ci-logs-bot"
          git config user.email "ci-logs-bot@users.noreply.github.com"
          git checkout -B "ci-logs-$GITHUB_JOB"
          git add -f ci-logs
          git commit -m "logs: $GITHUB_JOB (run $GITHUB_RUN_ID)" --allow-empty
          git push --force origin "HEAD:refs/heads/ci-logs-$GITHUB_JOB"
