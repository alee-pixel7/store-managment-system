<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Noir glass base -->
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241B41"/>
      <stop offset="0.55" stop-color="#151029"/>
      <stop offset="1" stop-color="#0C0918"/>
    </linearGradient>
    <!-- Violet ambient light from top -->
    <radialGradient id="sheen" cx="0.5" cy="0.16" r="0.75">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#8B5CF6" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <!-- Cube faces: light from top-left -->
    <linearGradient id="top" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#EDE9FE"/>
      <stop offset="0.5" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6D28D9"/>
      <stop offset="1" stop-color="#40198A"/>
    </linearGradient>
    <!-- Rim light on the glass edge -->
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C4B5FD" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0.25"/>
    </linearGradient>
    <!-- Top-edge specular for the cube -->
    <linearGradient id="spec" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <!-- ===== Noir glass rounded square ===== -->
  <rect x="52" y="52" width="920" height="920" rx="212" fill="url(#base)"/>
  <rect x="52" y="52" width="920" height="920" rx="212" fill="url(#sheen)"/>
  <!-- inner hairline rim -->
  <rect x="66" y="66" width="892" height="892" rx="200" fill="none" stroke="url(#rim)" stroke-width="7"/>
  <!-- subtle inner glass reflection -->
  <path d="M180 150 Q512 96 844 150 Q512 260 180 150 Z" fill="#FFFFFF" opacity="0.05"/>

  <!-- ===== ambient floor glow ===== -->
  <ellipse cx="512" cy="768" rx="252" ry="62" fill="#7C3AED" opacity="0.55" filter="url(#soft)"/>

  <!-- ===== Amethyst inventory cube ===== -->
  <g filter="url(#glow)">
    <!-- top face -->
    <path d="M512 258 L768 406 L512 554 L256 406 Z" fill="url(#top)"/>
    <!-- left face -->
    <path d="M256 406 L512 554 L512 806 L256 658 Z" fill="url(#left)"/>
    <!-- right face -->
    <path d="M512 554 L768 406 L768 658 L512 806 Z" fill="url(#right)"/>

    <!-- crisp edges -->
    <path d="M512 258 L768 406 L512 554 L256 406 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="6" stroke-linejoin="round"/>
    <path d="M256 406 L256 658 L512 806 L768 658 L768 406" fill="none" stroke="#C4B5FD" stroke-opacity="0.35" stroke-width="6" stroke-linejoin="round"/>
    <path d="M512 554 L512 806" stroke="#EDE9FE" stroke-opacity="0.65" stroke-width="7" stroke-linecap="round"/>

    <!-- specular sweep on top-left of top face -->
    <path d="M512 258 L384 332 Q440 330 512 292 Z" fill="url(#spec)" opacity="0.8"/>
    <!-- tape/seam hint on right face (package feel) -->
    <path d="M640 480 L640 730" stroke="#DDD6FE" stroke-opacity="0.22" stroke-width="10"/>
  </g>

  <!-- ===== sparkles ===== -->
  <path d="M760 226 L773 268 L815 281 L773 294 L760 336 L747 294 L705 281 L747 268 Z"
        fill="#F5F3FF" filter="url(#glow)"/>
  <path d="M272 300 L280 324 L304 332 L280 340 L272 364 L264 340 L240 332 L264 324 Z"
        fill="#C4B5FD" opacity="0.95"/>
</svg>
