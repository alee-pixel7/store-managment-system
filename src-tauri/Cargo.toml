[package]
name = "store-management-system"
version = "1.0.0"
description = "Store Management System - Desktop App"
authors = ["Store Management"]
edition = "2021"

[lib]
name = "store_management_system_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
